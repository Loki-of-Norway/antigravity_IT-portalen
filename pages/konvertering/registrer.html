<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registrer deg på IT-portalen for å få tilgang til alle ressurser og personlige innstillinger.">
  <title>IT-portalen - Digital Læring</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="/Images/Loki_Brukerstøtte.png">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/index.html" class="logo">
          <img src="/Images/Loki_Brukerstøtte.png" alt="Loki Brukerstøtte" class="logo-icon">
          <span class="logo-text">IT-portalen</span>
        </a>
        <h1>Opprett konto</h1>
        <p>Registrer deg for å få tilgang til alle ressurser</p>
      </div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name" class="form-label">Fullt navn</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Ola Nordmann" required>
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">E-postadresse</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="din@epost.no" required>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Passord</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Minimum 8 tegn" required minlength="8">
          <p class="form-help">Passordet må være minst 8 tegn langt</p>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Bekreft passord</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Gjenta passordet" required>
        </div>
        
        <div class="form-group">
          <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" name="terms" style="width: auto; margin-top: 0.25rem;" required>
            <span style="font-size: 0.875rem; color: var(--text-gray);">Jeg aksepterer <a href="#">vilkårene</a> og <a href="/pages/artikler/personvernerklaering.html" target="_blank">personvernerklæringen</a></span>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Opprett konto
        </button>
      </form>
      
      <div class="auth-divider">
        <span>eller</span>
      </div>
      
      <button class="btn btn-outline btn-lg" style="width: 100%;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        Fortsett med GitHub
      </button>
      
      <p class="auth-footer">
        Har du allerede konto? <a href="/pages/konvertering/login.html">Logg inn</a>
      </p>
    </div>
  </div>
  
  <script src="/js/script.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
